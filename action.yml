name: 'droast — Dockerfile linter'
description: 'Lint Dockerfiles with all 85 rules and report findings as GitHub annotations.' # droast:rule-count
author: 'immanuwell'

branding:
  icon: 'alert-triangle'
  color: 'red'

inputs:
  files:
    description: >
      Dockerfile(s) to lint. Space-separated list or glob pattern.
      Defaults to 'Dockerfile' in the repository root.
    required: false
    default: 'Dockerfile'
  min-severity:
    description: 'Minimum severity to report: info, warning, or error (empty uses droast.toml or the built-in default)'
    required: false
    default: ''
  preset:
    description: 'Built-in preset: minimal, security, performance, production, or strict'
    required: false
    default: ''
  category:
    description: 'Comma-separated rule categories to run'
    required: false
    default: ''
  skip-category:
    description: 'Comma-separated rule categories to skip'
    required: false
    default: ''
  skip:
    description: 'Comma-separated rule IDs to skip, e.g. DF001,DF012'
    required: false
    default: ''
  no-roast:
    description: 'Suppress the snarky messages — show technical findings only'
    required: false
    default: 'false'
  no-fail:
    description: 'Exit 0 even when errors are found (non-blocking / advisory mode)'
    required: false
    default: 'false'
  baseline:
    description: 'Path in the repository to a droast baseline JSON file'
    required: false
    default: ''
  only-new:
    description: 'Report only findings absent from baseline (requires baseline)'
    required: false
    default: 'false'
  engine:
    description: 'Build-context conventions: docker or podman'
    required: false
    default: ''
  image-tag:
    description: 'droast image tag to pull (e.g. latest, 1.7.0)' # droast:release-version
    required: false
    default: 'latest'

runs:
  using: composite
  steps:
    - name: Run droast
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_MIN_SEVERITY: ${{ inputs.min-severity }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_SKIP_CATEGORY: ${{ inputs.skip-category }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_NO_ROAST: ${{ inputs.no-roast }}
        INPUT_NO_FAIL: ${{ inputs.no-fail }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_ONLY_NEW: ${{ inputs.only-new }}
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        ARGS=()

        ARGS+=(--format github)

        if [[ -n "$INPUT_MIN_SEVERITY" ]]; then
          ARGS+=(--min-severity "$INPUT_MIN_SEVERITY")
        fi

        if [[ -n "$INPUT_PRESET" ]]; then
          ARGS+=(--preset "$INPUT_PRESET")
        fi

        if [[ -n "$INPUT_CATEGORY" ]]; then
          ARGS+=(--category "$INPUT_CATEGORY")
        fi

        if [[ -n "$INPUT_SKIP_CATEGORY" ]]; then
          ARGS+=(--skip-category "$INPUT_SKIP_CATEGORY")
        fi

        if [[ -n "$INPUT_SKIP" ]]; then
          ARGS+=(--skip "$INPUT_SKIP")
        fi

        if [[ "$INPUT_NO_ROAST" == "true" ]]; then
          ARGS+=(--no-roast)
        fi

        if [[ "$INPUT_NO_FAIL" == "true" ]]; then
          ARGS+=(--no-fail)
        fi

        if [[ -n "$INPUT_BASELINE" ]]; then
          ARGS+=(--baseline "$INPUT_BASELINE")
        fi

        if [[ "$INPUT_ONLY_NEW" == "true" ]]; then
          if [[ -z "$INPUT_BASELINE" ]]; then
            echo "::error title=droast configuration::'only-new' requires the 'baseline' input."
            exit 2
          fi
          ARGS+=(--only-new)
        fi

        if [[ -n "$INPUT_ENGINE" ]]; then
          ARGS+=(--engine "$INPUT_ENGINE")
        fi

        # Preserve space-separated file patterns without parsing input as Bash source.
        read -r -a FILE_PATTERNS <<< "${INPUT_FILES//$'\n'/ }"
        FILES=()
        for pattern in "${FILE_PATTERNS[@]}"; do
          mapfile -t matches < <(compgen -G "$pattern" || true)
          if ((${#matches[@]})); then
            FILES+=("${matches[@]}")
          else
            FILES+=("$pattern")
          fi
        done

        docker run --rm \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -w /workspace \
          "ghcr.io/immanuwell/droast:$INPUT_IMAGE_TAG" \
          "${ARGS[@]}" \
          "${FILES[@]}"
