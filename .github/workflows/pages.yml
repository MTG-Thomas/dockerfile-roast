name: Build and deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Sync public metadata"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Verify public metadata
        run: ./scripts/update-public-metadata.sh --check

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: 0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          archive="$RUNNER_TEMP/wasm-pack.tar.gz"
          install_dir="$RUNNER_TEMP/wasm-pack"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$WASM_PACK_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/wasm-pack" --version

      - name: Set version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
          echo "DROAST_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build WASM
        run: wasm-pack build --release --target web --out-dir docs/pkg

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY: ${{ secrets.DEPLOY_CMD }}
        run: |
          echo "$SSH_KEY" | install -m 600 /dev/stdin /tmp/dk
          eval "$DEPLOY"
          rm -f /tmp/dk
